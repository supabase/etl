# Build the task runner into its own target dir so alternating between
# `cargo x ...` and `cargo build`/`cargo run` stops invalidating shared crates.io
# deps whose unified feature sets differ between the two graphs.
[alias]
xtask = "run --target-dir target/xtask --package xtask --"
x = "run --quiet --target-dir target/xtask --package xtask --"

[env]
# duckdb-rs bundles commit d591bb1da2 with a generated dev version label.
# Stamp its actual release label so signed extensions for that commit load.
# Remove this workaround once upstream preserves .duckdb-release in bundled builds.
CXXFLAGS = '-DDUCKDB_VERSION="v2.0.0-alpha43678" -DDUCKDB_PATCH_VERSION="0-alpha43678"'
