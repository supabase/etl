[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true, features = ["clock", "serde", "std"] }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context", "env"] }
etl-config = { workspace = true }
k8s-openapi = { workspace = true, features = ["latest"] }
kube = { workspace = true, features = ["client", "derive", "rustls-tls", "ring"] }
pg_escape = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
schemars = "1.2.1"
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = "1.1.0"
xshell = "0.2.0"

[lints]
workspace = true
