[package]
name = "etl-experiments"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true, features = ["std"] }
chrono = { workspace = true, features = ["clock", "serde"] }
clap = { workspace = true, features = ["derive", "std", "help", "usage", "error-context"] }
etl-destinations = { workspace = true, features = ["snowflake", "tls-rustls-aws-lc-rs"] }
k8s-openapi = { workspace = true, features = ["v1_36"] }
kube = { workspace = true, features = ["client", "rustls-tls"] }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
rustls = { workspace = true, features = ["aws_lc_rs"] }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "json", "chrono"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "fs", "sync"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
