# Cross-binary slice partitioning requires 0.9.127; CI uses 0.9.133.
nextest-version = { required = "0.9.127", recommended = "0.9.133" }

[profile.default]
fail-fast = false
test-threads = "num-cpus"

# All tests that share the source Postgres cluster must run serially. Separate
# nextest test groups do not serialize against each other, so cluster-wide
# setting tests, etl replication tests, and PG-backed destination tests all
# share one group. Destination tests that do not use source Postgres run
# alongside these tests.
[test-groups.shared-pg]
max-threads = 1

# Bound remote BigQuery work without holding a source Postgres shard idle.
[test-groups.bigquery-destination]
max-threads = 1

[[profile.default.overrides]]
filter = "test(exclusive_) | binary_id(etl::main) | (binary_id(etl-destinations::main) & test(/^(bigquery|ducklake|iceberg)::/) & not test(/^bigquery::destination::/)) | (binary_id(etl-destinations::main) & test(/^clickhouse::pipeline/)) | (binary_id(etl-destinations) & test(/ducklake::core::tests::postgres_backed::/))"
test-group = "shared-pg"

[[profile.default.overrides]]
filter = "binary_id(etl-destinations::main) & test(/^bigquery::destination::/)"
test-group = "bigquery-destination"
# Start remote work before short unit tests so their execution can overlap.
priority = 10
