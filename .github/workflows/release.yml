name: Release

concurrency:
  group: release-${{ inputs.version || github.event.pull_request.head.ref }}
  cancel-in-progress: false

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  tag:
    name: Create release tag
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'release')
      )
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Validate release version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib

          with open("crates/etl-replicator/Cargo.toml", "rb") as manifest:
              package_version = tomllib.load(manifest)["package"]["version"]
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              version = os.environ.get("INPUT_VERSION", "").removeprefix("v")
          else:
              branch = os.environ.get("PR_HEAD_REF", "")
              if not branch.startswith("release/v"):
                  raise SystemExit("Expected release branch release/vX.Y.Z")
              version = branch.removeprefix("release/v")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Expected release version X.Y.Z without leading zeroes")
          if version != package_version:
              raise SystemExit("Release version must match the checked-out package version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag=v{version}\n")
          PYTHON

      - name: Validate release source
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo '::error::Releases must use a commit on main'
            exit 1
          fi

      - name: Create release tag
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            if [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::Tag $TAG already exists on a different commit; run this workflow from that tag to retry it"
              exit 1
            fi
            echo "Tag $TAG already exists on this commit; skipping creation."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  image:
    name: Publish image
    needs: tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      version: ${{ needs.tag.outputs.version }}
    secrets:
      PROD_AWS_ROLE: ${{ secrets.PROD_AWS_ROLE }}

  release:
    name: Publish GitHub release
    needs: [tag, image]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Release ${{ needs.tag.outputs.tag }}
          body: |
            Release ${{ needs.tag.outputs.tag }}

            Public Docker images:
            - `public.ecr.aws/supabase/etl-replicator:${{ needs.tag.outputs.tag }}`
            - `public.ecr.aws/supabase/etl-replicator:${{ needs.image.outputs.sha }}`

            [ECR Public Gallery](https://gallery.ecr.aws/supabase/etl-replicator)
