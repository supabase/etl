name: Prepare release

concurrency:
  group: prepare-release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      release:
        description: "Manual release version (e.g. 1.2.3). Overrides bump."
        type: string
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare release PR
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false

      - name: Install release tools
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-edit@0.13.13,git-cliff@2.14.2

      - name: Set workspace version
        shell: bash
        env:
          MANUAL_RELEASE: ${{ inputs.release }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ -n "${MANUAL_RELEASE}" ]]; then
            # Validate SemVer (strict X.Y.Z numeric to align with repo conventions).
            if [[ ! "${MANUAL_RELEASE}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Provided release '${MANUAL_RELEASE}' is not a valid SemVer (expected X.Y.Z)." >&2
              exit 1
            fi
            echo "Setting workspace version to ${MANUAL_RELEASE} (manual)."
            cargo set-version --workspace "${MANUAL_RELEASE}"
          else
            echo "Bumping workspace version by '${BUMP}'."
            cargo set-version --workspace --bump "${BUMP}"
          fi

      - name: Read release version
        id: ver
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import re
          import tomllib

          with open("crates/etl-replicator/Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version):
              raise SystemExit("Expected package version X.Y.Z")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"next={version}\n")
          PYTHON

      - name: Update changelog
        env:
          NEXT_VERSION: ${{ steps.ver.outputs.next }}
        run: git cliff --config cliff.toml --tag "v${NEXT_VERSION}" --unreleased --prepend CHANGELOG.md

      - name: Create release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(release): v${{ steps.ver.outputs.next }}"
          title: "chore(release): v${{ steps.ver.outputs.next }}"
          body: |
            This PR prepares release v${{ steps.ver.outputs.next }}.

            - Bumps workspace versions.
            - Updates CHANGELOG.md with unreleased changes.

            Merging this PR into `main` will trigger the release workflow which tags the commit, publishes Docker images, and creates the GitHub Release.
          branch: release/v${{ steps.ver.outputs.next }}
          base: main
          labels: |
            release
            automated
          add-paths: |
            Cargo.toml
            Cargo.lock
            crates/*/Cargo.toml
            CHANGELOG.md
          delete-branch: true
