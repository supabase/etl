name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Optional full commit SHA to build; defaults to the selected workflow ref"
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  route:
    name: Resolve publication route
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      release: ${{ steps.pr.outputs.release }}
      head-ref: ${{ steps.pr.outputs.head-ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Resolve merged PR
        if: github.event_name == 'push'
        id: pr
        uses: ./.github/actions/merged-pr

  image:
    name: Publish image
    needs: route
    if: |
      github.event_name == 'workflow_dispatch' || needs.route.outputs.release == 'false'
    uses: ./.github/workflows/reusable-publish-image.yml
    with:
      commit: ${{ github.event_name == 'workflow_dispatch' && inputs.commit || '' }}
    secrets:
      PROD_AWS_ROLE: ${{ secrets.PROD_AWS_ROLE }}

  release:
    name: Publish release
    needs: route
    if: github.event_name == 'push' && needs.route.outputs.release == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      head-ref: ${{ needs.route.outputs.head-ref }}
    secrets:
      PROD_AWS_ROLE: ${{ secrets.PROD_AWS_ROLE }}
