name: Benchmark

on:
  schedule:
    # Off the whole hour and away from the other scheduled workflows.
    - cron: "53 5 * * *"
  workflow_dispatch:
    inputs:
      benchmark_runner:
        description: Blacksmith runner size for the benchmark job.
        required: true
        type: choice
        options:
          - blacksmith-8vcpu-ubuntu-2404
          - blacksmith-16vcpu-ubuntu-2404
          - blacksmith-32vcpu-ubuntu-2404
        default: blacksmith-16vcpu-ubuntu-2404
      warehouses:
        description: Number of TPC-C warehouses to prepare.
        required: true
        default: "10"
      tpcc_threads:
        description: Optional go-tpc prepare and streaming threads. Empty derives from warehouses and runner CPUs.
        required: false
        default: ""
      streaming_duration_seconds:
        description: Duration for TPC-C streaming.
        required: false
        default: "60"
      streaming_drain_quiet_ms:
        description: Quiet period with no CDC events before TPC-C streaming is considered drained.
        required: true
        default: "2000"
      max_table_sync_workers:
        description: Maximum table sync workers.
        required: true
        default: "8"
      max_copy_connections_per_table:
        description: Maximum copy connections per table.
        required: true
        default: "4"
      batch_max_fill_ms:
        description: Maximum stream batch fill time in milliseconds.
        required: true
        default: "1000"
      memory_budget_ratio:
        description: Ratio of detected memory reserved for stream batch bytes.
        required: true
        default: "0.2"
      enable_memory_backpressure:
        description: Enable ETL memory backpressure during the benchmark.
        required: true
        type: boolean
        default: false
      destination:
        description: Destination to benchmark; `all` runs null, clickhouse, and snowflake as a matrix.
        required: true
        type: choice
        options:
          - "null"
          - bigquery
          - clickhouse
          - snowflake
          - all
        default: "null"
      commit:
        description: Optional full commit SHA to benchmark (backfill); defaults to the selected workflow ref.
        required: false
        default: ""
      bq_project_id:
        description: BigQuery project ID; defaults to the BENCHMARK_BQ_PROJECT_ID repository variable.
        required: false
        default: ""
      bq_dataset_id:
        description: BigQuery dataset ID; defaults to the BENCHMARK_BQ_DATASET_ID repository variable.
        required: false
        default: ""
      force_prepare:
        description: Drop and regenerate existing TPC-C tables.
        required: true
        type: boolean
        default: false
      skip_table_copy:
        description: Skip the table-copy benchmark.
        required: true
        type: boolean
        default: false
      skip_table_streaming:
        description: Skip the table-streaming benchmark.
        required: true
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: bench
  POSTGRES_PORT: 5430
  POSTGRES_HOST: localhost
  BENCHMARK_SAMPLES: 3
  BENCHMARK_WARMUP_SAMPLES: 1
  BENCH_CLICKHOUSE_URL: http://localhost:8123
  BENCH_CLICKHOUSE_USER: etl
  BENCH_CLICKHOUSE_PASSWORD: etl
  BENCH_CLICKHOUSE_DATABASE: default
  # Scheduled runs have no inputs; keep these fallbacks equal to the input defaults.
  WAREHOUSES: ${{ inputs.warehouses || '10' }}
  # Not TPCC_THREADS: the xtask reads that env var, and an empty value fails to parse.
  TPCC_THREADS_INPUT: ${{ inputs.tpcc_threads }}
  STREAMING_DURATION_SECONDS: ${{ inputs.streaming_duration_seconds || '60' }}
  STREAMING_DRAIN_QUIET_MS: ${{ inputs.streaming_drain_quiet_ms || '2000' }}
  MAX_TABLE_SYNC_WORKERS: ${{ inputs.max_table_sync_workers || '8' }}
  MAX_COPY_CONNECTIONS_PER_TABLE: ${{ inputs.max_copy_connections_per_table || '4' }}
  BATCH_MAX_FILL_MS: ${{ inputs.batch_max_fill_ms || '1000' }}
  MEMORY_BUDGET_RATIO: ${{ inputs.memory_budget_ratio || '0.2' }}
  ENABLE_MEMORY_BACKPRESSURE: ${{ inputs.enable_memory_backpressure || false }}
  FORCE_PREPARE: ${{ inputs.force_prepare || false }}
  SKIP_TABLE_COPY: ${{ inputs.skip_table_copy || false }}
  SKIP_TABLE_STREAMING: ${{ inputs.skip_table_streaming || false }}
  BQ_PROJECT_ID: ${{ inputs.bq_project_id || vars.BENCHMARK_BQ_PROJECT_ID }}
  BQ_DATASET_ID: ${{ inputs.bq_dataset_id || vars.BENCHMARK_BQ_DATASET_ID }}

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      trigger: ${{ steps.plan.outputs.trigger }}
      destinations: ${{ steps.plan.outputs.destinations }}
      runner: ${{ steps.plan.outputs.runner }}
    steps:
      - name: Resolve run plan
        id: plan
        env:
          COMMIT: ${{ inputs.commit }}
          DESTINATION: ${{ inputs.destination || 'all' }}
          RUNNER: ${{ inputs.benchmark_runner || 'blacksmith-16vcpu-ubuntu-2404' }}
        run: |
          set -euo pipefail
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Commit must be a full 40-character lowercase SHA'
            exit 1
          fi

          if [[ -n "$COMMIT" ]]; then
            trigger=backfill
            sha="$COMMIT"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            trigger=nightly
            sha="$GITHUB_SHA"
          else
            trigger=manual
            sha="$GITHUB_SHA"
          fi

          case "$DESTINATION" in
            # BigQuery stays out until its benchmark secret and project/dataset variables exist.
            all) destinations='["null","clickhouse","snowflake"]' ;;
            null | clickhouse | bigquery | snowflake) destinations="[\"$DESTINATION\"]" ;;
            *)
              echo "::error::Unknown destination: $DESTINATION"
              exit 1
              ;;
          esac

          {
            echo "sha=$sha"
            echo "trigger=$trigger"
            echo "destinations=$destinations"
            echo "runner=$RUNNER"
          } >> "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark (${{ matrix.destination }})
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        destination: ${{ fromJSON(needs.plan.outputs.destinations) }}
    # One run per destination at a time: BigQuery and Snowflake runs share remote
    # datasets; queueing keeps every pending backfill instead of replacing it.
    concurrency:
      group: benchmark-${{ matrix.destination }}
      cancel-in-progress: false
      queue: max
    env:
      DESTINATION: ${{ matrix.destination }}
      BENCHMARK_TRIGGER: ${{ needs.plan.outputs.trigger }}
      BENCHMARK_RUNNER: ${{ needs.plan.outputs.runner }}
      # Only a successful nightly or manual job uploads under this name, so its
      # presence marks a usable baseline for that destination. Backfills use
      # their own name so they never become a comparison baseline.
      ARTIFACT_NAME: ${{ format('{0}-{1}', needs.plan.outputs.trigger == 'backfill' && 'benchmark-backfill' || 'benchmark-results', matrix.destination) }}
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ''
          cache-key: benchmark
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' && needs.plan.outputs.trigger != 'backfill' }}

      - name: Install system tools
        run: |
          set -euo pipefail
          missing_packages=()
          if ! command -v go >/dev/null 2>&1; then
            missing_packages+=(golang-go)
          fi
          if ! command -v psql >/dev/null 2>&1; then
            missing_packages+=(postgresql-client)
          fi
          if ! command -v unzip >/dev/null 2>&1; then
            missing_packages+=(unzip)
          fi
          if (( ${#missing_packages[@]} > 0 )); then
            sudo apt-get update
            sudo apt-get install -y "${missing_packages[@]}"
          fi
          go install github.com/pingcap/go-tpc/cmd/go-tpc@v1.0.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Start Postgres
        run: |
          POSTGRES_IMAGE=postgres:18 \
          POSTGRES_VERSION=18 \
            cargo --locked xtask postgres start --shards 1 --base-port "$POSTGRES_PORT" --source-only

      - name: Prepare BigQuery key
        if: matrix.destination == 'bigquery'
        env:
          BQ_SA_KEY_JSON: ${{ secrets.BENCHMARK_BQ_SA_KEY_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${BQ_SA_KEY_JSON}" ]]; then
            echo "BENCHMARK_BQ_SA_KEY_JSON secret is required for BigQuery benchmarks." >&2
            exit 1
          fi
          if [[ -z "${BQ_PROJECT_ID}" || -z "${BQ_DATASET_ID}" ]]; then
            echo "BigQuery benchmarks need bq_project_id and bq_dataset_id inputs or the BENCHMARK_BQ_PROJECT_ID and BENCHMARK_BQ_DATASET_ID repository variables." >&2
            exit 1
          fi
          umask 077
          printf '%s' "${BQ_SA_KEY_JSON}" > "$RUNNER_TEMP/bigquery-key.json"

      - name: Start ClickHouse
        if: matrix.destination == 'clickhouse'
        run: docker compose -f scripts/docker/docker-compose.yaml up -d --wait clickhouse

      - name: Check Snowflake connection
        if: matrix.destination == 'snowflake'
        env:
          BENCH_SNOWFLAKE_CONNECTION: ${{ secrets.BENCH_SNOWFLAKE_CONNECTION }}
        run: |
          set -euo pipefail
          if [[ -z "${BENCH_SNOWFLAKE_CONNECTION}" ]]; then
            echo "BENCH_SNOWFLAKE_CONNECTION secret is required for Snowflake benchmarks." >&2
            exit 1
          fi

      - name: Record benchmark environment
        run: |
          set -euo pipefail
          mkdir -p target/bench-results

          tpcc_threads="${TPCC_THREADS_INPUT:-derived}"
          host_memory="$(awk '/MemTotal/ { printf "%.2f GiB", $2 / 1024 / 1024 }' /proc/meminfo || true)"
          if [[ -z "${host_memory}" ]]; then
            host_memory="unavailable"
          fi

          cgroup_memory_limit="unavailable"
          if [[ -r /sys/fs/cgroup/memory.max ]]; then
            cgroup_memory_limit="$(cat /sys/fs/cgroup/memory.max)"
          elif [[ -r /sys/fs/cgroup/memory/memory.limit_in_bytes ]]; then
            cgroup_memory_limit="$(cat /sys/fs/cgroup/memory/memory.limit_in_bytes)"
          fi

          {
            echo "## 🖥️ Benchmark environment"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Commit | $(git rev-parse HEAD) |"
            echo "| Trigger | ${BENCHMARK_TRIGGER} |"
            echo "| Runner | ${BENCHMARK_RUNNER} |"
            echo "| Runner name | ${RUNNER_NAME} |"
            echo "| Runner OS | ${RUNNER_OS} |"
            echo "| Runner arch | ${RUNNER_ARCH} |"
            echo "| CPUs | $(nproc) |"
            echo "| Host memory | ${host_memory} |"
            echo "| Cgroup memory limit | ${cgroup_memory_limit} |"
            echo "| Warehouses | ${WAREHOUSES} |"
            echo "| TPC-C threads | ${tpcc_threads} |"
            echo "| Measured samples | ${BENCHMARK_SAMPLES} |"
            echo "| Warmup samples | ${BENCHMARK_WARMUP_SAMPLES} |"
            echo "| Memory budget ratio | ${MEMORY_BUDGET_RATIO} |"
            echo "| Memory backpressure | ${ENABLE_MEMORY_BACKPRESSURE} |"
            echo "| Destination | ${DESTINATION} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run benchmarks
        env:
          BQ_SA_KEY_FILE: ${{ runner.temp }}/bigquery-key.json
          BENCH_SNOWFLAKE_CONNECTION: ${{ secrets.BENCH_SNOWFLAKE_CONNECTION }}
        run: |
          set -euo pipefail

          args=(
            benchmark
            --host "$POSTGRES_HOST"
            --port "$POSTGRES_PORT"
            --database "$POSTGRES_DB"
            --username "$POSTGRES_USER"
            --password "$POSTGRES_PASSWORD"
            --warehouses "$WAREHOUSES"
            --streaming-drain-quiet-ms "$STREAMING_DRAIN_QUIET_MS"
            --max-table-sync-workers "$MAX_TABLE_SYNC_WORKERS"
            --max-copy-connections-per-table "$MAX_COPY_CONNECTIONS_PER_TABLE"
            --batch-max-fill-ms "$BATCH_MAX_FILL_MS"
            --memory-budget-ratio "$MEMORY_BUDGET_RATIO"
            --destination "$DESTINATION"
            --samples "$BENCHMARK_SAMPLES"
            --warmup-samples "$BENCHMARK_WARMUP_SAMPLES"
            --output-dir target/bench-results
          )

          if [[ -n "$TPCC_THREADS_INPUT" ]]; then
            args+=(--tpcc-threads "$TPCC_THREADS_INPUT")
          fi

          if [[ -n "$STREAMING_DURATION_SECONDS" ]]; then
            args+=(--streaming-duration-seconds "$STREAMING_DURATION_SECONDS")
          fi

          if [[ "$ENABLE_MEMORY_BACKPRESSURE" == "true" ]]; then
            args+=(--enable-memory-backpressure)
          fi

          if [[ "$FORCE_PREPARE" == "true" ]]; then
            args+=(--force-prepare)
          fi

          if [[ "$SKIP_TABLE_COPY" == "true" ]]; then
            args+=(--skip-table-copy)
          fi

          if [[ "$SKIP_TABLE_STREAMING" == "true" ]]; then
            args+=(--skip-table-streaming)
          fi

          if [[ "$DESTINATION" == "bigquery" ]]; then
            args+=(--bq-project-id "$BQ_PROJECT_ID")
            args+=(--bq-dataset-id "$BQ_DATASET_ID")
            args+=(--bq-sa-key-file "$BQ_SA_KEY_FILE")
          fi

          cargo --locked xtask "${args[@]}"

      # Written by the workflow, not xtask, so backfills of older commits get one too.
      - name: Write run manifest
        env:
          # Equals the jobs API `id`, so the manifest joins to its exact matrix
          # job. `GITHUB_JOB` is only the YAML key and is shared by every leg.
          JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          COMMITTED_AT="$(git show -s --format=%cI HEAD)"
          export COMMIT_SHA COMMITTED_AT

          python3 <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          results_dir = Path("target/bench-results")
          manifest_path = results_dir / "manifest.json"

          def memory_bytes():
              try:
                  for line in Path("/proc/meminfo").read_text().splitlines():
                      if line.startswith("MemTotal:"):
                          return int(line.split()[1]) * 1024
              except OSError:
                  pass
              return None

          def cgroup_memory_limit():
              for path in ("/sys/fs/cgroup/memory.max", "/sys/fs/cgroup/memory/memory.limit_in_bytes"):
                  try:
                      return Path(path).read_text().strip()
                  except OSError:
                      continue
              return None

          reports = sorted(
              path.name
              for path in results_dir.glob("*.json")
              if path != manifest_path and not path.name.startswith(".")
          )
          if not reports:
              raise SystemExit("no benchmark reports found to describe in the manifest")

          manifest = {
              "schema_version": 1,
              "kind": "benchmark",
              "trigger": os.environ["BENCHMARK_TRIGGER"],
              "destination": os.environ["DESTINATION"],
              "commit": {
                  "sha": os.environ["COMMIT_SHA"],
                  "committed_at": os.environ["COMMITTED_AT"],
              },
              "workflow_sha": os.environ["GITHUB_SHA"],
              "github": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "workflow": os.environ["GITHUB_WORKFLOW"],
                  "event_name": os.environ["GITHUB_EVENT_NAME"],
                  "ref": os.environ["GITHUB_REF"],
                  "run_id": int(os.environ["GITHUB_RUN_ID"]),
                  "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
                  "job": os.environ["GITHUB_JOB"],
                  # Null rather than failing the benchmark if the context is absent.
                  "job_id": int(os.environ["JOB_CHECK_RUN_ID"]) if os.environ.get("JOB_CHECK_RUN_ID") else None,
              },
              "runner": {
                  "label": os.environ["BENCHMARK_RUNNER"],
                  "name": os.environ.get("RUNNER_NAME"),
                  "os": os.environ.get("RUNNER_OS"),
                  "arch": os.environ.get("RUNNER_ARCH"),
                  "cpus": os.cpu_count(),
                  "memory_bytes": memory_bytes(),
                  "cgroup_memory_limit": cgroup_memory_limit(),
              },
              "reports": reports,
              "created_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Summarize benchmark results
        run: |
          set -euo pipefail

          python3 <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          results_dir = Path("target/bench-results")

          def load(name):
              path = results_dir / name
              if not path.exists():
                  return None
              return json.loads(path.read_text())

          def number(value, digits=2):
              if value is None:
                  return "-"
              if isinstance(value, int) or float(value).is_integer():
                  return f"{int(value):,}"
              return f"{float(value):,.{digits}f}"

          def seconds(ms):
              if ms is None:
                  return "-"
              return f"{float(ms) / 1000:,.2f} s"

          def pct(value):
              if value is None:
                  return "-"
              return f"{float(value):,.2f}%"

          def samples(report):
              sample_count = report.get("sample_count")
              warmup_count = report.get("warmup_sample_count", 0)
              if sample_count is None:
                  return "1"
              if warmup_count:
                  return f"{sample_count} + {warmup_count} warmup"
              return str(sample_count)

          def spread(report, key):
              return pct((report.get("sample_summary") or {}).get(key, {}).get("spread_pct"))

          def table(headers, rows):
              print("| " + " | ".join(headers) + " |")
              print("| " + " | ".join("---" for _ in headers) + " |")
              for row in rows:
                  print("| " + " | ".join(str(cell) for cell in row) + " |")

          table_copy = load("table_copy.json")
          table_streaming = load("table_streaming.json")

          print()
          print("## 📊 Benchmark results")
          print()

          summary = []
          if table_copy:
              summary.append([
                  "📦 Table copy",
                  f"{number(table_copy.get('rows_per_second'))} rows/s",
                  f"{number(table_copy.get('estimated_mib_per_second'))} MiB/s",
                  seconds(table_copy.get("total_ms")),
                  spread(table_copy, "rows_per_second"),
              ])
          if table_streaming:
              summary.append([
                  "🔁 Table streaming",
                  f"{number(table_streaming.get('end_to_end_with_shutdown_events_per_second'))} events/s",
                  f"{number(table_streaming.get('end_to_end_with_shutdown_estimated_mib_per_second'))} MiB/s",
                  seconds(table_streaming.get("total_ms")),
                  spread(table_streaming, "end_to_end_with_shutdown_events_per_second"),
              ])

          if summary:
              table(["Benchmark", "Median throughput", "Data rate", "Total", "Sample spread"], summary)
              print()
          else:
              print("No benchmark JSON reports were written.")
              raise SystemExit(0)

          if table_copy:
              print("### 📦 Table copy")
              table(
                  ["Metric", "Value"],
                  [
                      ["Samples", samples(table_copy)],
                      ["Rows copied", number(table_copy.get("copied_rows"))],
                      ["Rows/s", number(table_copy.get("rows_per_second"))],
                      ["Rows/s spread", spread(table_copy, "rows_per_second")],
                      ["Decoded MiB", number(table_copy.get("estimated_copied_mib"))],
                      ["Decoded MiB/s", number(table_copy.get("estimated_mib_per_second"))],
                      ["Decoded MiB/s spread", spread(table_copy, "estimated_mib_per_second")],
                      ["Copy wait", seconds(table_copy.get("copy_wait_ms"))],
                      ["Total", seconds(table_copy.get("total_ms"))],
                  ],
              )
              print()

          if table_streaming:
              print("### 🔁 Table streaming")
              stats = table_streaming.get("destination_stats", {})
              table(
                  ["Metric", "Value"],
                  [
                      ["Samples", samples(table_streaming)],
                      ["Workload", table_streaming.get("workload", "-")],
                      ["Produced events", number(table_streaming.get("produced_events"))],
                      ["Observed CDC events", number(table_streaming.get("observed_cdc_events"))],
                      ["Events/s", number(table_streaming.get("end_to_end_with_shutdown_events_per_second"))],
                      ["Events/s spread", spread(table_streaming, "end_to_end_with_shutdown_events_per_second")],
                      ["Decoded MiB/s", number(table_streaming.get("end_to_end_with_shutdown_estimated_mib_per_second"))],
                      ["Decoded MiB/s spread", spread(table_streaming, "end_to_end_with_shutdown_estimated_mib_per_second")],
                      ["Inserts", number(stats.get("inserts"))],
                      ["Updates", number(stats.get("updates"))],
                      ["Deletes", number(stats.get("deletes"))],
                      ["Total", seconds(table_streaming.get("total_ms"))],
                  ],
              )
              print()
          PY

      - name: Compare benchmark results
        if: needs.plan.outputs.trigger != 'backfill'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          cargo --locked xtask benchmark-compare \
            --current-dir target/bench-results \
            --artifact-name "$ARTIFACT_NAME" \
            --output target/bench-results/benchmark-comparison.md
          status=$?
          set -e
          cat target/bench-results/benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload benchmark results
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: target/bench-results/*.json
          if-no-files-found: error

      # Failed reports stay available for debugging under a name that is never
      # used as a baseline.
      - name: Upload failed benchmark results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-failed-${{ matrix.destination }}
          path: target/bench-results/*.json
          if-no-files-found: warn

      - name: Remove BigQuery credentials
        if: always() && matrix.destination == 'bigquery'
        run: rm -f "$RUNNER_TEMP/bigquery-key.json"
