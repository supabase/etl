name: Coverage comparison

on:
  pull_request:
    paths:
      - .github/workflows/coverage-comparison.yml
      - .github/workflows/reusable-tests.yml
      - .github/scripts/time-coverage.sh

permissions:
  contents: read

concurrency:
  group: coverage-comparison-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  compare:
    if: github.head_ref == 'chore/coverage-pooling' && github.event.pull_request.head.repo.full_name == github.repository
    name: ${{ matrix.sample }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sample: baseline-1
            profile: ''
          - sample: pooled-1
            profile: etl-%8m.profraw
          - sample: pooled-2
            profile: etl-%8m.profraw
          - sample: baseline-2
            profile: ''
          - sample: baseline-3
            profile: ''
          - sample: pooled-3
            profile: etl-%8m.profraw
    uses: ./.github/workflows/reusable-tests.yml
    with:
      coverage: true
      coverage-profile-file: ${{ matrix.profile }}
      coverage-experiment: ${{ matrix.sample }}
    secrets:
      TESTS_BIGQUERY_PROJECT_ID: ${{ secrets.TESTS_BIGQUERY_PROJECT_ID }}
      TESTS_BIGQUERY_SA_KEY_JSON: ${{ secrets.TESTS_BIGQUERY_SA_KEY_JSON }}
