name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: nightly-2026-09-16
          components: rustfmt
          cache: false
      - name: Install cargo-sort
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-sort@2.1.0
      - name: Check Rust formatting
        run: cargo +nightly-2026-09-16 fmt --all -- --check
      - name: Check manifest ordering
        run: cargo sort --workspace --grouped --check

  clippy:
    name: Clippy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ''
          cache-key: clippy
          cache-workspaces: |
            . -> target
            fuzz -> target
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check MSRV consistency
        run: |
          python3 - <<'PYTHON'
          import re
          import tomllib
          from pathlib import Path

          with open("Cargo.toml", "rb") as source:
              workspace = tomllib.load(source)["workspace"]
          with open("rust-toolchain.toml", "rb") as source:
              toolchain = tomllib.load(source)["toolchain"]["channel"]
          if workspace["package"]["rust-version"] != toolchain:
              raise SystemExit("Workspace MSRV must match rust-toolchain.toml")
          dockerfile = Path("crates/etl-replicator/Dockerfile").read_text()
          if not re.search(rf"^ARG RUST_VERSION={re.escape(toolchain)}$", dockerfile, re.M):
              raise SystemExit("Docker Rust version must match rust-toolchain.toml")
          for member in workspace["members"]:
              with (Path(member) / "Cargo.toml").open("rb") as source:
                  declared = tomllib.load(source)["package"].get("rust-version")
              if declared is not None and declared not in ({"workspace": True}, toolchain):
                  raise SystemExit(f"MSRV mismatch in {member}")
          PYTHON
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features --no-deps -- -D warnings

      - name: Check fuzz crate
        # Fuzz is a separate workspace without a committed Cargo.lock.
        run: cargo check --manifest-path fuzz/Cargo.toml

  tls:
    name: TLS (AWS-LC only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      # Library crates with default features off and only the AWS-LC backend selected.
      TLS_FEATURES: etl/tls-rustls-aws-lc-rs,etl-postgres/tls-rustls-aws-lc-rs,etl-postgres/store,etl-maintenance/tls-rustls-aws-lc-rs,etl-destinations/tls-rustls-aws-lc-rs
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ''
          cache-key: tls-aws-lc
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Verify SQLx ring feature is absent
        shell: bash
        run: |
          set -euo pipefail

          # ducklake makes sqlx a dependency of etl-destinations and etl-maintenance;
          # resolving the feature graph does not compile DuckDB.
          sqlx_features="$(cargo tree --locked \
            -p etl -p etl-postgres -p etl-maintenance -p etl-destinations \
            --no-default-features \
            --features "${TLS_FEATURES},etl-destinations/ducklake" \
            -e features -i sqlx)"

          if ! grep -q 'sqlx feature "tls-rustls-aws-lc-rs"' <<< "${sqlx_features}"; then
            echo "sqlx feature tls-rustls-aws-lc-rs is not enabled" >&2
            exit 1
          fi

          if grep -q 'sqlx feature "tls-rustls-ring"' <<< "${sqlx_features}"; then
            echo "sqlx feature tls-rustls-ring is enabled by:" >&2
            grep -A5 'sqlx feature "tls-rustls-ring"' <<< "${sqlx_features}" >&2
            exit 1
          fi

      - name: Check AWS-LC build
        run: |
          cargo check --locked \
            -p etl -p etl-postgres -p etl-maintenance -p etl-destinations \
            --no-default-features \
            --features "${TLS_FEATURES}"

  snowflake:
    name: Features (Snowflake only)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ''
          cache-key: snowflake
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check Snowflake feature isolation
        run: cargo check --locked -p etl-destinations -p etl-replicator --all-targets --no-default-features --features snowflake

  workflow-lint:
    name: Workflow lint
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  test-build:
    name: Build tests
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ''
          cache-key: tests
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install nextest
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-nextest@0.9.133
      - name: Build test archive
        run: |
          mkdir -p target/ci
          cargo nextest archive --locked --workspace --all-features --archive-file target/ci/tests.tar.zst
      - name: Build test runner
        run: |
          cargo build --locked --workspace --all-features --bin xtask
          tar -czf target/ci/test-tools.tar.gz -C target/debug xtask
      - name: Run doctests
        run: cargo test --locked --doc --workspace --all-features --no-fail-fast
      - name: Upload test binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-binaries
          path: |
            target/ci/tests.tar.zst
            target/ci/test-tools.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  test:
    name: Tests (${{ matrix.name }})
    needs: test-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 17
            version: '17'
            image: postgres:17
          - name: PostgreSQL 16
            version: '16'
            image: postgres:16
          - name: PostgreSQL 15
            version: '15'
            image: postgres:15
          - name: PostgreSQL 14
            version: '14'
            image: postgres:14
          - name: OrioleDB beta14 (PostgreSQL 17)
            version: '17'
            image: orioledb/orioledb:beta14-pg17
    uses: ./.github/workflows/reusable-tests.yml
    with:
      postgres-version: ${{ matrix.version }}
      postgres-image: ${{ matrix.image }}
      postgres-only: ${{ matrix.image != 'postgres:17' }}

  coverage:
    name: Tests (PostgreSQL 18, coverage)
    uses: ./.github/workflows/reusable-tests.yml
    with:
      coverage: true
    secrets:
      TESTS_BIGQUERY_PROJECT_ID: ${{ secrets.TESTS_BIGQUERY_PROJECT_ID }}
      TESTS_BIGQUERY_SA_KEY_JSON: ${{ secrets.TESTS_BIGQUERY_SA_KEY_JSON }}

  multigres:
    name: Tests (Multigres)
    needs: test-build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          cache: false
          rustflags: ''
      - name: Install nextest
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-nextest@0.9.133
      - name: Download test binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-binaries
          path: target/ci
      - name: Extract test runner
        run: tar -xzf target/ci/test-tools.tar.gz -C target/ci
      - name: Run Multigres tests
        run: target/ci/xtask multigres test --archive-file target/ci/tests.tar.zst

  image:
    name: Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            platform: linux/amd64
            runner: blacksmith-8vcpu-ubuntu-2404
          - arch: ARM64
            platform: linux/arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build image
        uses: ./.github/actions/build-image
        with:
          platform: ${{ matrix.platform }}

  ci-passed:
    name: CI passed
    if: always()
    needs: [format, clippy, tls, snowflake, workflow-lint, test-build, test, coverage, multigres, image]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
