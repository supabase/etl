name: Publish image (reusable)

on:
  workflow_call:
    inputs:
      commit:
        description: Optional full source commit SHA, independent of the workflow revision.
        type: string
        default: ''
      build-vcpus:
        description: Native build worker size (4 for Python images, 8 for Rust images).
        type: number
        default: 8
      version:
        description: Optional release version (X.Y.Z).
        type: string
        default: ''
    secrets:
      PROD_AWS_ROLE:
        description: AWS IAM role for publishing to the existing ECR Public repository.
        required: true
    outputs:
      sha:
        description: Source commit built for both architectures.
        value: ${{ jobs.prepare.outputs.sha }}

permissions:
  contents: read

concurrency:
  group: image-build-${{ inputs.commit || github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    name: Prepare image tags
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.tags.outputs.sha }}
      tags: ${{ steps.tags.outputs.tags }}
      stable: ${{ steps.tags.outputs.stable }}
    steps:
      - name: Validate source commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -n "$COMMIT" && ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Commit must be a full 40-character lowercase SHA'
            exit 1
          fi
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
          # Resolve source once; both native builds use prepare.outputs.sha.
          ref: ${{ inputs.commit || github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Validate build worker size
        env:
          BUILD_VCPUS: ${{ inputs.build-vcpus }}
        run: |
          case "$BUILD_VCPUS" in
            4|8) ;;
            *) echo '::error::Image builds require 4 or 8 vCPUs'; exit 1 ;;
          esac
      - name: Validate image tags
        id: tags
        env:
          STABLE: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' }}
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          if [[ "$STABLE" == true ]]; then
            if [[ -n "$COMMIT" ]] || ! git merge-base --is-ancestor "$sha" "$main_sha"; then
              echo '::error::Stable publication must build the merged main commit without a source override'
              exit 1
            fi
            tags="$sha"
            if [[ -n "$VERSION" ]]; then
              if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                echo '::error::Release version must have the form X.Y.Z without leading zeroes'
                exit 1
              fi
              if [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" != "$sha" ]]; then
                echo '::error::Release tag must point to the merged commit'
                exit 1
              fi
              tags="$sha v$VERSION"
            fi
          else
            if [[ -n "$VERSION" ]]; then
              echo '::error::Release image tags require a merged main PR'
              exit 1
            fi
            tags="$sha-experimental"
          fi
          {
            echo "sha=$sha"
            echo "tags=$tags"
            echo "stable=$STABLE"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build image (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ format('blacksmith-{0}vcpu-ubuntu-2404{1}', inputs.build-vcpus, matrix.arch == 'arm64' && '-arm' || '') }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AMD64
            arch: amd64
            platform: linux/amd64
          - name: ARM64
            arch: arm64
            platform: linux/arm64
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Check out image source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          path: .image-source
      - name: Log in to ECR Public
        id: registry
        uses: ./.github/actions/registry-login
        with:
          role: ${{ secrets.PROD_AWS_ROLE }}
      - name: Build and push platform image
        id: build
        uses: ./.github/actions/build-image
        with:
          context: .image-source
          platform: ${{ matrix.platform }}
          image: ${{ steps.registry.outputs.image }}
          push: 'true'
      - name: Record platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH.txt"
      - name: Upload platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.arch }}
          overwrite: true
          path: ${{ runner.temp }}/digests/*.txt
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish image manifest
    needs: [prepare, build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Log in to ECR Public
        id: registry
        uses: ./.github/actions/registry-login
        with:
          role: ${{ secrets.PROD_AWS_ROLE }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Publish and verify multi-platform manifests
        env:
          DIGEST_DIRECTORY: ${{ runner.temp }}/digests
          IMAGE: ${{ steps.registry.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          : "${IMAGE:?Registry image is required}"
          : "${TAGS:?Image tags are required}"

          digests=()
          for arch in amd64 arm64; do
            digest=$(cat "$DIGEST_DIRECTORY/$arch.txt")
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "::error::Invalid $arch image digest"
              exit 1
            fi
            digests+=("$digest")
          done

          read -r -a tags <<< "$TAGS"
          sources=()
          tag_args=()
          for digest in "${digests[@]}"; do sources+=("$IMAGE@$digest"); done
          for tag in "${tags[@]}"; do tag_args+=(--tag "$IMAGE:$tag"); done
          # Inspect the combined index before assigning any deployable tags.
          docker buildx imagetools create --dry-run "${sources[@]}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect --raw "$IMAGE:${tags[0]}" |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  latest:
    name: Promote latest image
    if: needs.prepare.outputs.stable == 'true'
    needs: [prepare, manifest]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: image-latest
      cancel-in-progress: false
      queue: max
    steps:
      - name: Check out workflow actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.workflow_sha }}
      - name: Log in to ECR Public
        id: registry
        uses: ./.github/actions/registry-login
        with:
          role: ${{ secrets.PROD_AWS_ROLE }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Promote current main image
        env:
          IMAGE: ${{ steps.registry.outputs.image }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          : "${IMAGE:?Registry image is required}"

          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ -z "$main_sha" ]]; then
            echo '::error::Could not resolve the current main commit'
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$main_sha" ]]; then
            echo 'Skipping latest promotion because main has advanced.'
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$SOURCE_SHA"
