name: Dependency audit

on:
  schedule:
    - cron: "23 0 * * *"
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependency-audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/dependency-audit.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit dependencies
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2.81.10
        with:
          tool: cargo-deny@0.19.0

      - name: Check dependency advisories
        id: check
        run: cargo deny --locked --workspace --all-features check advisories

      # Findings for the CI metrics collector, which reads them only from runs
      # on `main`, so pull requests skip this. They are written and kept when
      # the check fails. The second pass reuses the advisory database the check
      # fetched, so both see the same advisories. A broken manifest must not
      # fail the audit itself.
      - name: Write audit results
        id: results
        if: >-
          always() && github.event_name != 'pull_request'
          && (steps.check.outcome == 'success' || steps.check.outcome == 'failure')
        continue-on-error: true
        env:
          # Equals the jobs API `id`, so the audit manifest joins to this job.
          JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          mkdir -p target/audit-results
          cargo deny --locked --workspace --all-features --format json check --disable-fetch advisories \
            2> target/audit-results/cargo-deny.jsonl || true
          CARGO_DENY_VERSION="$(cargo deny --version | cut -d' ' -f2)" \
            jq -n -f .github/ci-metrics/audit-manifest.jq \
            < target/audit-results/cargo-deny.jsonl > target/audit-results/manifest.json
      - name: Upload audit results
        if: always() && steps.results.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: audit-results-${{ job.check_run_id }}
          path: target/audit-results/manifest.json
          if-no-files-found: error
