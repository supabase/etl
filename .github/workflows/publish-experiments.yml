name: Publish experiment runner

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Staging workload nodes are Arm64. This does not publish a replicator image.
    runs-on: blacksmith-8vcpu-ubuntu-2404-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
      - name: Build and publish the selected source revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/etl-experiments"
          docker buildx build --platform linux/arm64 --push \
            --file crates/etl-experiments/Dockerfile \
            --tag "$image:$SOURCE_SHA" --metadata-file /tmp/image.json .
          digest=$(python3 -c 'import json; print(json.load(open("/tmp/image.json"))["containerimage.digest"])')
          printf 'Runner image: %s@%s\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
